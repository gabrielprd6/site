<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Composition abstraite : outils reliés entre eux">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2=".7" y2="1">
      <stop offset="0%"   stop-color="#F4F4F2"/>
      <stop offset="100%" stop-color="#D6D6D2"/>
    </linearGradient>
    <filter id="n1" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="c1"><rect width="800" height="600"/></clipPath>
  </defs>

  <g clip-path="url(#c1)">
    <rect width="800" height="600" fill="url(#g1)"/>

    <g stroke="#0E0E0E" stroke-opacity=".06" stroke-width="1">
      <path d="M0 150h800M0 300h800M0 450h800M200 0v600M400 0v600M600 0v600"/>
    </g>

    <!-- Chemins orthogonaux : la double saisie devient une liaison -->
    <g fill="none" stroke="#0E0E0E" stroke-opacity=".32" stroke-width="1.5">
      <path d="M170 190h130a30 30 0 0 1 30 30v160a30 30 0 0 0 30 30h140"/>
      <path d="M170 410h90a30 30 0 0 0 30-30V250a30 30 0 0 1 30-30h270"/>
      <path d="M400 300h230"/>
    </g>

    <!-- Nœuds -->
    <g stroke="#0E0E0E" stroke-opacity=".45" stroke-width="1.5" fill="#FFFFFF" fill-opacity=".65">
      <rect x="80" y="150" width="90" height="80" rx="14"/>
      <rect x="80" y="370" width="90" height="80" rx="14"/>
      <rect x="630" y="260" width="90" height="80" rx="14"/>
    </g>
    <rect x="345" y="260" width="110" height="80" rx="16" fill="#6D28D9" fill-opacity=".92"/>
    <g stroke="#FFFFFF" stroke-opacity=".9" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M378 300h44M400 278v44"/>
    </g>

    <rect width="800" height="600" filter="url(#n1)" opacity=".05"/>
  </g>
</svg>
