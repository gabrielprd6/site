<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Composition abstraite : ondes concentriques autour d'un point actif">
  <defs>
    <linearGradient id="g2" x1=".2" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#F2F2F0"/>
      <stop offset="100%" stop-color="#D2D2CE"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="52%" r="42%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="n2" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="c2"><rect width="800" height="600"/></clipPath>
  </defs>

  <g clip-path="url(#c2)">
    <rect width="800" height="600" fill="url(#g2)"/>
    <rect width="800" height="600" fill="url(#halo)"/>

    <!-- Ondes : la réponse qui se propage, 24 h/24 -->
    <g fill="none" stroke="#0E0E0E" transform="translate(400 312)">
      <circle r="52"  stroke-opacity=".38" stroke-width="1.5"/>
      <circle r="106" stroke-opacity=".28" stroke-width="1.5"/>
      <circle r="164" stroke-opacity=".19" stroke-width="1.5"/>
      <circle r="226" stroke-opacity=".12" stroke-width="1.5"/>
      <circle r="292" stroke-opacity=".07" stroke-width="1.5"/>
    </g>

    <!-- Arc actif -->
    <path d="M400 106a206 206 0 0 1 178 103" fill="none" stroke="#6D28D9" stroke-opacity=".85" stroke-width="3" stroke-linecap="round"/>
    <circle cx="400" cy="312" r="17" fill="#6D28D9"/>

    <!-- Points d'entrée sur les orbites -->
    <g fill="#0E0E0E" fill-opacity=".5">
      <circle cx="400" cy="206" r="5"/>
      <circle cx="564" cy="312" r="5"/>
      <circle cx="288" cy="405" r="5"/>
    </g>

    <g stroke="#0E0E0E" stroke-opacity=".07" stroke-width="1">
      <path d="M0 90h800M0 534h800"/>
    </g>

    <rect width="800" height="600" filter="url(#n2)" opacity=".05"/>
  </g>
</svg>
