<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Composition abstraite : cadres de pages superposés">
  <defs>
    <linearGradient id="g3" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0%"   stop-color="#F4F4F2"/>
      <stop offset="100%" stop-color="#D4D4D0"/>
    </linearGradient>
    <filter id="n3" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="c3"><rect width="800" height="600"/></clipPath>
  </defs>

  <g clip-path="url(#c3)">
    <rect width="800" height="600" fill="url(#g3)"/>

    <g stroke="#0E0E0E" stroke-opacity=".06" stroke-width="1">
      <path d="M0 120h800M0 480h800M120 0v600M680 0v600"/>
    </g>

    <!-- Cadres décalés : la profondeur vient du décalage, pas d'une ombre portée -->
    <g stroke="#0E0E0E" stroke-width="1.5" fill="#FFFFFF">
      <rect x="212" y="112" width="400" height="272" rx="14" fill-opacity=".35" stroke-opacity=".18"/>
      <rect x="176" y="152" width="400" height="272" rx="14" fill-opacity=".55" stroke-opacity=".28"/>
      <rect x="140" y="192" width="400" height="272" rx="14" fill-opacity=".82" stroke-opacity=".45"/>
    </g>

    <!-- Contenu du cadre de premier plan -->
    <g transform="translate(140 192)">
      <path d="M0 42h400" stroke="#0E0E0E" stroke-opacity=".2" stroke-width="1.5"/>
      <g fill="#0E0E0E" fill-opacity=".22">
        <circle cx="26" cy="21" r="4.5"/><circle cx="44" cy="21" r="4.5"/><circle cx="62" cy="21" r="4.5"/>
      </g>
      <rect x="26" y="74" width="196" height="16" rx="8" fill="#0E0E0E" fill-opacity=".38"/>
      <rect x="26" y="104" width="148" height="12" rx="6" fill="#0E0E0E" fill-opacity=".18"/>
      <rect x="26" y="126" width="120" height="12" rx="6" fill="#0E0E0E" fill-opacity=".18"/>
      <rect x="26" y="166" width="128" height="40" rx="20" fill="#6D28D9" fill-opacity=".92"/>
      <rect x="262" y="74" width="112" height="132" rx="12" fill="#0E0E0E" fill-opacity=".1"/>
    </g>

    <rect width="800" height="600" filter="url(#n3)" opacity=".05"/>
  </g>
</svg>
